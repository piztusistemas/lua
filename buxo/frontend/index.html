<!DOCTYPE html>
<html lang="gl">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Buxo</title>
    <link rel="stylesheet" href="./src/style.css"/>
</head>
<body>
<div id="app">
    <header id="cabeceira">
        <div id="marca"><span id="marca-nome">Buxo</span><span id="materia"></span></div>
        <div id="cabeceira-accions">
            <span id="estado-ia" class="chip"></span>
            <button id="btn-construir" class="primario" title="A IA le os documentos convertidos e constrúe a wiki">Construír a bóveda</button>
            <button id="btn-parar" class="perigo" hidden>Parar</button>
            <button id="btn-licenza" title="Licenza de Buxo (MIT) e avisos de terceiros">Licenza</button>
        </div>
    </header>

    <div id="aviso" class="aviso" hidden></div>

    <main id="zonas">
        <section class="zona" id="zona-seleccion">
            <h2>Seleccionar ficheiros</h2>
            <div class="zona-corpo">
                <button id="btn-pdfs" class="grande">📄 Engadir ficheiros do computador…</button>
                <p class="axuda">PDF, imaxes (fotos de exames, esquemas), Markdown, Word, PowerPoint, Excel, HTML ou EPUB.</p>
                <label for="modo" class="rotulo">Fórmulas, debuxos e documentos escaneados</label>
                <select id="modo" title="Como se le cada ficheiro">
                    <option value="auto">Automático: a IA le as páxinas só se ten fórmulas, debuxos ou está escaneado</option>
                    <option value="vision">Sempre coa IA: o mellor resultado (máis lento e custa máis)</option>
                    <option value="texto">Só texto: gratis e rápido, pero pérdense fórmulas e debuxos</option>
                </select>
                <label for="urls" class="rotulo">Ou URL (dun PDF ou dunha páxina onde buscalos)</label>
                <textarea id="urls" rows="5" spellcheck="false" placeholder="https://exemplo.org/documento.pdf&#10;https://exemplo.org/recursos/"></textarea>
                <label for="instrucion" class="rotulo">Instrución para filtrar (opcional): que PDF da páxina queres</label>
                <textarea id="instrucion" rows="3" placeholder="Ex.: só os exames de 2023 en adiante; ignora as solucións"></textarea>
                <button id="btn-urls" class="grande">🌐 Engadir URL</button>
                <p class="axuda" id="axuda-urls"></p>
            </div>
        </section>
        <section class="zona" id="zona-cola">
            <h2>Ficheiros a tratar <span id="conta" class="chip"></span></h2>
            <div class="zona-corpo" id="cola"></div>
        </section>
    </main>

    <section id="progreso" hidden aria-label="Progreso da construción">
        <div class="prog-total">
            <strong id="prog-titulo">Progreso</strong>
            <div id="prog-segmentos" class="prog-segmentos" role="progressbar" aria-valuemin="0" aria-valuemax="100"></div>
            <span id="prog-pct" class="prog-pct"></span>
        </div>
        <div id="prog-lista" class="prog-lista"></div>
    </section>

    <div id="licenza" class="superposicion" hidden role="dialog" aria-modal="true" aria-label="Licenza">
        <div class="caixa-licenza">
            <header><strong>Licenza</strong><button id="btn-licenza-pechar" aria-label="Pechar">✕</button></header>
            <pre id="licenza-texto"></pre>
        </div>
    </div>

    <div id="log-panel">
        <div class="log-header">
            <span>▸ <span>Rexistro</span></span>
            <div class="log-header-actions">
                <button id="btn-clear-log" title="Limpar o rexistro">⌫</button>
                <button id="btn-toggle-log" title="Minimizar/ampliar">–</button>
            </div>
        </div>
        <div id="log-output"></div>
    </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
